name: Compilar para Appetize

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appetize-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verificar la estructura del proyecto
        run: python3 verificar_estructura.py

      - name: Compilar y empaquetar para iOS Simulator ARM64
        run: bash scripts/build-simulator.sh

      - name: Guardar la aplicacion compilada
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MapasYPermisos-Appetize-${{ github.run_number }}
          path: dist-cloud/MapasYPermisos-Simulator-*.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Guardar registro si falla la compilacion
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Registro-compilacion-${{ github.run_number }}
          path: .build-cloud/**/build.log
          if-no-files-found: ignore
          retention-days: 7

